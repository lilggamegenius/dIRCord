apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'idea'

group 'com.LilG'
version '2.2.0'

repositories {
    //jcenter()
    //maven { url 'http://amelentev.github.io/mvnrepo/' }
    maven { url "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.+'
    implementation group: 'com.github.pircbotx', name: 'pircbotx', version: 'master-SNAPSHOT'
    implementation group: 'me.xdrop', name: 'fuzzywuzzy', version: '1.3.+'
    implementation group: 'com.google.guava', name: 'guava', version: '32.0.1-jre'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.+'
    implementation group: 'org.eclipse.mylyn.github', name: 'org.eclipse.egit.github.core', version: '2.1.+'

    implementation('net.dv8tion:JDA:5.6.1')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.+'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.+'

    //compile files('javac8-oo-plugin-0.5.jar')

    //compile 'java-oo:javac8-oo-plugin:0.5'

    //compile fileTree(dir: 'C#')
}

//version = '2.2.0'

tasks.register('fatJar', Jar) {
    manifest {
        attributes 'Main-Class': "com.LilG.Main"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier = "all"
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}